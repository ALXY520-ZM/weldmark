<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>焊缝标注工具 v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; background:#1a1a2e; color:#fff; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { padding:10px 14px; background:#16213e; display:flex; align-items:center; justify-content:space-between; }
  .topbar h1 { font-size:17px; font-weight:600; }
  .topbar .tip { font-size:11px; color:#8ab4f8; }
  #canvasWrap { flex:1; overflow:hidden; background:#0f0f1e; position:relative; touch-action:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .empty { position:absolute; top:45%; left:0; right:0; text-align:center; color:#666; font-size:15px; pointer-events:none; z-index:5; }
  .zoomBar { position:absolute; right:10px; bottom:90px; display:flex; flex-direction:column; gap:8px; z-index:8; }
  .zoomBtn { width:42px; height:42px; border-radius:50%; border:none; background:#0f3460cc; color:#fff; font-size:20px; cursor:pointer; backdrop-filter:blur(4px); }
  .zoomBtn:active { background:#e94560; }
  .toolbar { background:#16213e; padding:10px 8px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn { flex:1; min-width:60px; padding:9px 4px; border:none; border-radius:8px; background:#0f3460; color:#fff; font-size:13px; cursor:pointer; text-align:center; }
  .btn.active { background:#e94560; }
  .btn.green { background:#16a34a; }
  .btn.orange { background:#d97706; }
  .btn.gray { background:#475569; }
  .colors { display:flex; gap:6px; align-items:center; padding:0 4px; }
  .dot { width:20px; height:20px; border-radius:50%; border:2px solid #fff3; cursor:pointer; }
  .dot.sel { border-color:#fff; box-shadow:0 0 6px #fff8; }
  .widths { display:flex; gap:6px; align-items:center; }
  .wd { width:24px; height:24px; border-radius:6px; background:#0f3460; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:10px; color:#aaa; }
  .wd.sel { background:#e94560; color:#fff; }
  input[type=file] { display:none; }

  /* 自定义弹窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:99; backdrop-filter:blur(3px); }
  .mask.show { display:flex; }
  .modal { background:#1e2a45; border-radius:18px; padding:20px 22px; width:78%; max-width:320px; box-shadow:0 12px 40px rgba(0,0,0,.5); border:1px solid #33415e; }
  .modal h3 { font-size:16px; margin-bottom:14px; color:#fff; }
  .modal input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid #3a4a6e; background:#0f1a33; color:#fff; font-size:15px; outline:none; }
  .modal input:focus { border-color:#e94560; }
  .modal .row { display:flex; gap:10px; margin-top:16px; }
  .modal .row button { flex:1; padding:10px 0; border:none; border-radius:10px; font-size:14px; cursor:pointer; }
  .modal .ok { background:#e94560; color:#fff; }
  .modal .cancel { background:#2a3a5e; color:#9db2d0; }
  .modeRow { display:flex; gap:8px; margin-top:12px; }
  .modeBtn { flex:1; padding:9px 0; border:1px solid #3a4a6e; border-radius:10px; background:#0f1a33; color:#9db2d0; font-size:13px; cursor:pointer; }
  .modeBtn.sel { background:#e94560; border-color:#e94560; color:#fff; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🔧 焊缝标注工具 v3</h1>
  <div class="tip">双指缩放 · 标注恒定大小</div>
</div>

<div id="canvasWrap">
  <canvas id="cv"></canvas>
  <div class="empty" id="emptyTip">⬆ 先点下方"选择照片"</div>
  <div class="zoomBar">
    <button class="zoomBtn" id="zin">➕</button>
    <button class="zoomBtn" id="zout">➖</button>
    <button class="zoomBtn" id="zreset">⤢</button>
  </div>
</div>

<div class="toolbar">
  <button class="btn green" id="btnPick">📷 照片</button>
  <button class="btn" id="btnLine">✏️ 画线</button>
  <button class="btn" id="btnText">🔤 文字</button>
  <button class="btn gray" id="btnUndo">↩️</button>
  <button class="btn gray" id="btnClear">🗑</button>
  <button class="btn orange" id="btnSave">💾 保存</button>
  <div class="colors" id="colorRow"></div>
  <div class="widths">
    <div class="wd" data-w="4">细</div>
    <div class="wd sel" data-w="7">中</div>
    <div class="wd" data-w="12">粗</div>
  </div>
</div>

<input type="file" id="file" accept="image/*">

<!-- 自定义弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">输入长度</h3>
    <input id="mInput" type="text" placeholder="如：120">
    <div class="modeRow" id="mModeRow" style="display:none;">
      <button class="modeBtn" data-m="满焊">满焊</button>
      <button class="modeBtn" data-m="点焊">点焊</button>
    </div>
    <div class="row">
      <button class="cancel" id="mCancel">取消</button>
      <button class="ok" id="mOk">确定</button>
    </div>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const file = document.getElementById('file');
  const emptyTip = document.getElementById('emptyTip');

  let img = null;
  let imgW=0, imgH=0;
  let view = { scale:1, tx:0, ty:0 };
  let fitScale = 1;
  let lines = [];
  let texts = [];
  let undoStack = [];
  let mode = 'line';
  let color = '#ff2d2d';
  let lineW = 7;
  let drawing = null;
  let hasImage = false;

  // 颜色
  const colors = ['#ff2d2d','#ffa500','#ffe600','#00e5ff','#00ff88','#ffffff'];
  const colorRow = document.getElementById('colorRow');
  colors.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===0?' sel':'');
    d.style.background=c;
    d.onclick=()=>{color=c;document.querySelectorAll('.dot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
    colorRow.appendChild(d);
  });
  document.querySelectorAll('.wd').forEach(w=>{
    w.onclick=()=>{lineW=+w.dataset.w;document.querySelectorAll('.wd').forEach(x=>x.classList.remove('sel'));w.classList.add('sel');};
  });
  const btnLine=document.getElementById('btnLine'), btnText=document.getElementById('btnText');
  function setMode(m){mode=m;btnLine.classList.toggle('active',m==='line');btnText.classList.toggle('active',m==='text');}
  setMode('line');
  btnLine.onclick=()=>setMode('line');
  btnText.onclick=()=>setMode('text');

  // ===== 自定义弹窗 =====
  const mask=document.getElementById('mask'), mTitle=document.getElementById('mTitle'), mInput=document.getElementById('mInput');
  const mModeRow=document.getElementById('mModeRow');
  let modalCb=null;
  let selMode=''; // 选中的焊接方式

  // 方式按钮切换
  document.querySelectorAll('.modeBtn').forEach(b=>{
    b.onclick=()=>{
      selMode=b.dataset.m;
      document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });

  // 通用弹窗（无方式选择）
  function openModal(title,placeholder,defaultVal,cb){
    mTitle.textContent=title;
    mInput.placeholder=placeholder||'';
    mInput.value=defaultVal||'';
    mModeRow.style.display='none';
    selMode='';
    modalCb=cb;
    mask.classList.add('show');
    setTimeout(()=>mInput.focus(),100);
  }
  // 焊接标注弹窗（长度+满焊/点焊）
  function openLineModal(cb){
    mTitle.textContent='焊接标注';
    mInput.placeholder='输入长度（mm），如120';
    mInput.value='';
    mModeRow.style.display='flex';
    selMode='';
    document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('sel'));
    modalCb=cb;
    mask.classList.add('show');
    setTimeout(()=>mInput.focus(),100);
  }
  function closeModal(val){
    mask.classList.remove('show');
    if(modalCb){ const cb=modalCb; modalCb=null; cb(val); }
  }
  document.getElementById('mOk').onclick=()=>{
    if(mModeRow.style.display==='flex') closeModal({len:mInput.value.trim(), mode:selMode});
    else closeModal(mInput.value.trim());
  };
  document.getElementById('mCancel').onclick=()=>closeModal(null);
  mask.addEventListener('click',e=>{ if(e.target===mask) closeModal(null); });

  // 上传图片
  document.getElementById('btnPick').onclick=()=>file.click();
  file.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height; const mx=2500;
        if(Math.max(w,h)>mx){ const k=mx/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        imgW=w; imgH=h; img=im;
        hasImage=true; emptyTip.style.display='none';
        lines=[]; texts=[]; undoStack=[];
        fitView(); draw();
      };
      im.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  };

  // 自适应视图
  function fitView(){
    const r=wrap.getBoundingClientRect();
    if(!r.width||!r.height) return;
    fitScale=Math.min(r.width/imgW, r.height/imgH)*0.96;
    view.scale=fitScale;
    view.tx=(r.width-imgW*fitScale)/2;
    view.ty=(r.height-imgH*fitScale)/2;
  }
  function resetView(){ fitView(); draw(); }
  document.getElementById('zreset').onclick=resetView;
  function zoomBy(f){
    const r=wrap.getBoundingClientRect();
    const cx=r.width/2, cy=r.height/2;
    const old=view.scale;
    let ns=Math.max(fitScale*0.4, Math.min(old*f, fitScale*8));
    view.tx=cx-((cx-view.tx)/old)*ns;
    view.ty=cy-((cy-view.ty)/old)*ns;
    view.scale=ns; draw();
  }
  document.getElementById('zin').onclick=()=>zoomBy(1.4);
  document.getElementById('zout').onclick=()=>zoomBy(1/1.4);

  // 屏幕坐标 → 画布坐标（canvas 1:1，无偏移）
  function getPos(clientX,clientY){
    const r=cv.getBoundingClientRect();
    const sx=clientX-r.left, sy=clientY-r.top;
    return { x:(sx-view.tx)/view.scale, y:(sy-view.ty)/view.scale };
  }

  // 绘制
  function draw(){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.setTransform(view.scale,0,0,view.scale,view.tx,view.ty);
    if(img) ctx.drawImage(img,0,0,imgW,imgH);
    lines.forEach(L=>paintLine(L));
    texts.forEach(T=>paintText(T));
    if(drawing) paintLine(drawing);
    ctx.restore();
  }
  // 标注恒定屏幕大小：所有尺寸除以 view.scale
  function paintLine(L){
    ctx.save();
    const s=view.scale;
    const w=L.w/s;  // 屏幕恒定线宽
    ctx.strokeStyle=L.color; ctx.lineWidth=w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(L.x1,L.y1); ctx.lineTo(L.x2,L.y2); ctx.stroke();
    const ang=Math.atan2(L.y2-L.y1,L.x2-L.x1), al=w*3.2;
    ctx.beginPath();
    ctx.moveTo(L.x2,L.y2);
    ctx.lineTo(L.x2-al*Math.cos(ang-0.45), L.y2-al*Math.sin(ang-0.45));
    ctx.moveTo(L.x2,L.y2);
    ctx.lineTo(L.x2-al*Math.cos(ang+0.45), L.y2-al*Math.sin(ang+0.45));
    ctx.stroke();
    if(L.label){
      const fs=Math.max(14,Math.round(cv.width/45))/s; // 屏幕恒定字号
      ctx.font='bold '+fs+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      const mx=(L.x1+L.x2)/2, my=(L.y1+L.y2)/2-6/s;
      ctx.lineWidth=Math.max(2,3/s); ctx.strokeStyle='rgba(0,0,0,.75)';
      ctx.strokeText(L.label,mx,my); ctx.fillStyle=L.color;
      ctx.fillText(L.label,mx,my);
    }
    ctx.restore();
  }
  function paintText(T){
    ctx.save();
    const s=view.scale;
    const fs=Math.max(16,Math.round(cv.width/38))/s;
    ctx.font='bold '+fs+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(2,3/s); ctx.strokeStyle='rgba(0,0,0,.75)';
    ctx.strokeText(T.str,T.x,T.y); ctx.fillStyle=T.color;
    ctx.fillText(T.str,T.x,T.y);
    ctx.restore();
  }

  // ===== 手势 =====
  let pointers=new Map();
  let pinchDist=0;
  let pinchStart=null;
  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  function onStart(e){
    e.preventDefault();
    if(!hasImage) return;
    for(let i=0;i<e.touches.length;i++){
      const t=e.touches[i];
      pointers.set(t.identifier,{x:t.clientX,y:t.clientY});
    }
    if(pointers.size===2){
      const p=[...pointers.values()];
      pinchDist=dist(p[0],p[1]);
      pinchStart={scale:view.scale,tx:view.tx,ty:view.ty};
      drawing=null;
      return;
    }
    if(pointers.size===1 && mode==='line'){
      const p=getPos(e.touches[0].clientX,e.touches[0].clientY);
      drawing={x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,w:lineW,label:null};
    }
  }
  function onMove(e){
    e.preventDefault();
    for(let i=0;i<e.touches.length;i++){
      const t=e.touches[i];
      if(pointers.has(t.identifier)) pointers.set(t.identifier,{x:t.clientX,y:t.clientY});
    }
    if(pointers.size>=2 && pinchStart){
      const p=[...pointers.values()];
      const d=dist(p[0],p[1]);
      const r=wrap.getBoundingClientRect();
      const ns=Math.max(fitScale*0.4, Math.min(pinchStart.scale*(d/pinchDist), fitScale*8));
      const mx=(p[0].x+p[1].x)/2-r.left, my=(p[0].y+p[1].y)/2-r.top;
      view.scale=ns;
      view.tx=mx-((mx-pinchStart.tx)/pinchStart.scale)*ns;
      view.ty=my-((my-pinchStart.ty)/pinchStart.scale)*ns;
      draw();
      return;
    }
    if(pointers.size===1 && drawing){
      const p=getPos(e.touches[0].clientX,e.touches[0].clientY);
      drawing.x2=p.x; drawing.y2=p.y; draw();
    }
  }
  function onEnd(e){
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
      pointers.delete(e.changedTouches[i].identifier);
    }
    if(pointers.size<2){ pinchStart=null; pinchDist=0; }
    if(pointers.size===0){
      if(drawing){
        const L=drawing;
        const dd=Math.hypot(L.x2-L.x1,L.y2-L.y1);
        drawing=null;
        if(dd<10){ draw(); return; }
        if(mode==='line'){
          openLineModal(res=>{
            if(res){
              if(res.len) L.label=res.len+'mm';
              if(res.mode) L.label=(L.label?L.label+' · ':'')+res.mode;
              lines.push(L); undoStack.push({t:'line'});
            }
            draw();
          });
          draw();
        }
      } else if(mode==='text'){
        // 文字模式：记录点击位置
        const t=e.changedTouches[0];
        const p=getPos(t.clientX,t.clientY);
        openModal('输入文字','如：满焊 / 点焊','',val=>{
          if(val){
            const T={x:p.x,y:p.y,str:val,color,size:Math.round(cv.width/38)};
            texts.push(T); undoStack.push({t:'text'}); draw();
          }
        });
      }
    }
  }

  // 鼠标（电脑调试）
  let mouseDown=false, mouseMoved=false, mDownPos=null;
  cv.addEventListener('mousedown',e=>{
    if(!hasImage) return;
    mouseDown=true; mouseMoved=false;
    mDownPos={x:e.clientX,y:e.clientY};
    if(mode==='text') return;
    const p=getPos(e.clientX,e.clientY);
    drawing={x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,w:lineW,label:null};
  });
  cv.addEventListener('mousemove',e=>{
    if(mouseDown){
      if(mDownPos && (Math.abs(e.clientX-mDownPos.x)+Math.abs(e.clientY-mDownPos.y)>8)) mouseMoved=true;
      if(drawing){ const p=getPos(e.clientX,e.clientY); drawing.x2=p.x; drawing.y2=p.y; draw(); }
    }
  });
  window.addEventListener('mouseup',e=>{
    if(!mouseDown) return;
    mouseDown=false;
    if(mode==='text' && !mouseMoved){
      const p=getPos(e.clientX,e.clientY);
      openModal('输入文字','如：满焊 / 点焊','',val=>{
        if(val){ const T={x:p.x,y:p.y,str:val,color,size:Math.round(cv.width/38)}; texts.push(T); undoStack.push({t:'text'}); draw(); }
      });
    } else if(drawing){
      const L=drawing;
      const dd=Math.hypot(L.x2-L.x1,L.y2-L.y1);
      drawing=null;
      if(dd<10){ draw(); return; }
      openLineModal(res=>{
        if(res){
          if(res.len) L.label=res.len+'mm';
          if(res.mode) L.label=(L.label?L.label+' · ':'')+res.mode;
          lines.push(L); undoStack.push({t:'line'});
        }
        draw();
      });
      draw();
    }
  });

  cv.addEventListener('touchstart',onStart,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onEnd,{passive:false});
  cv.addEventListener('touchcancel',onEnd,{passive:false});

  // 撤销/清空/保存
  document.getElementById('btnUndo').onclick=()=>{
    const op=undoStack.pop(); if(!op) return;
    if(op.t==='line') lines.pop(); else texts.pop();
    draw();
  };
  document.getElementById('btnClear').onclick=()=>{
    if(!hasImage) return;
    openModal('确认清空','输入"清空"确认','',val=>{
      if(val==='清空'){ lines=[]; texts=[]; undoStack=[]; draw(); }
    });
  };
  document.getElementById('btnSave').onclick=()=>{
    if(!hasImage){ alert('请先选择照片'); return; }
    // 保存前先复位视图（导出完整图）
    fitView(); draw();
    const d=new Date(), ts=d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0')+''+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const dataUrl=cv.toDataURL('image/png');
    const fname='焊缝标注_'+ts+'.png';
    if(window.AndroidBridge){
      AndroidBridge.saveImage(dataUrl,fname);
    } else {
      const a=document.createElement('a'); a.download=fname; a.href=dataUrl; a.click();
    }
  };

  // canvas 1:1（修复偏移关键）
  function resizeCanvas(){
    const r=wrap.getBoundingClientRect();
    cv.width=Math.max(1,Math.round(r.width));
    cv.height=Math.max(1,Math.round(r.height));
    if(hasImage){ fitView(); draw(); }
  }
  window.addEventListener('resize',resizeCanvas);
  resizeCanvas();
})();
</script>
</body>
</html>
